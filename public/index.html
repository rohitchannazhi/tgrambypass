<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Bot Console</title>
<style>
  :root { --bg:#0f1419; --panel:#17202a; --line:#26323f; --text:#e6edf3; --dim:#8b98a5; --in:#202c39; --out:#2b6cb0; --accent:#4aa3ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f8; --panel:#fff; --line:#d9e0e7; --text:#14202b; --dim:#66747f; --in:#eef2f6; --out:#2b6cb0; --accent:#1f6fd1; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  aside { width:280px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside h1 { font-size:15px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); }
  #chats { overflow:auto; flex:1; }
  .chat { padding:10px 16px; cursor:pointer; border-bottom:1px solid var(--line); }
  .chat:hover, .chat.active { background:var(--in); }
  .chat b { display:block; }
  .chat span { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .chat .n { float:right; background:var(--accent); color:#fff; border-radius:9px; padding:0 6px; font-size:12px; }
  #newchat { padding:10px; border-top:1px solid var(--line); display:flex; gap:6px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel); font-weight:600; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:70%; padding:8px 12px; border-radius:12px; background:var(--in); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.out { align-self:flex-end; background:var(--out); color:#fff; }
  .msg small { display:block; opacity:.65; font-size:11px; margin-top:2px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--panel); }
  input, textarea { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; min-width:0; }
  form textarea { flex:1; resize:none; height:42px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 16px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
  #err { color:#ff6b6b; padding:0 16px 8px; min-height:1em; font-size:13px; }
  .empty { margin:auto; color:var(--dim); }
  @media (max-width:640px) { aside { width:100px; } .chat span { display:none; } #newchat { display:none; } }
</style>
</head>
<body>
<aside>
  <h1>Chats</h1>
  <div id="chats"></div>
  <div id="newchat">
    <input id="newid" placeholder="Chat ID" style="flex:1">
    <button id="newbtn" type="button">Open</button>
  </div>
</aside>
<main>
  <header id="title">Select a chat</header>
  <div id="log"><div class="empty">Message your bot on Telegram and the chat will appear here.</div></div>
  <div id="err"></div>
  <form id="form">
    <textarea id="text" placeholder="Type a message (Enter to send, Shift+Enter for newline)" disabled></textarea>
    <button id="send" disabled>Send</button>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const all = [];
const unread = {};
const known = {}; // chatId -> name
let current = null;

const time = (t) => new Date(t).toLocaleString([], { hour: "2-digit", minute: "2-digit", month: "short", day: "numeric" });

function bubble(m) {
  const d = document.createElement("div");
  d.className = "msg " + m.direction;
  const t = document.createElement("div");
  t.textContent = m.text;
  const s = document.createElement("small");
  s.textContent = (m.direction === "in" ? m.from + " · " : "") + time(m.date);
  d.append(t, s);
  return d;
}

function renderChats() {
  const last = {};
  for (const m of all) { last[m.chatId] = m; known[m.chatId] = m.chatName; }
  const ids = Object.keys(known).sort((a, b) => (last[b]?.date || 0) - (last[a]?.date || 0));
  $("chats").replaceChildren(...ids.map((id) => {
    const d = document.createElement("div");
    d.className = "chat" + (String(current) === id ? " active" : "");
    const n = unread[id] ? `<i class="n">${unread[id]}</i>` : "";
    d.innerHTML = `${n}<b></b><span></span>`;
    d.querySelector("b").textContent = known[id];
    d.querySelector("span").textContent = last[id]?.text || "";
    d.onclick = () => openChat(id);
    return d;
  }));
}

function renderLog() {
  const log = $("log");
  const msgs = all.filter((m) => String(m.chatId) === String(current));
  log.replaceChildren(...(msgs.length ? msgs.map(bubble) : [Object.assign(document.createElement("div"), { className: "empty", textContent: "No messages yet." })]));
  log.scrollTop = log.scrollHeight;
}

function openChat(id) {
  current = id;
  unread[id] = 0;
  $("title").textContent = (known[id] || "Chat") + "  ·  " + id;
  $("text").disabled = $("send").disabled = false;
  $("text").focus();
  renderChats(); renderLog();
}

$("newbtn").onclick = () => {
  const id = $("newid").value.trim();
  if (!/^-?\d+$/.test(id)) return ($("err").textContent = "Chat ID must be numeric.");
  $("err").textContent = "";
  known[id] ||= "Chat " + id;
  $("newid").value = "";
  openChat(id);
};

async function send() {
  const text = $("text").value.trim();
  if (!text || current == null) return;
  $("send").disabled = true; $("err").textContent = "";
  try {
    const r = await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ chatId: current, text }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    $("text").value = "";
  } catch (e) { $("err").textContent = "Send failed: " + e.message; }
  $("send").disabled = false; $("text").focus();
}
$("form").onsubmit = (e) => { e.preventDefault(); send(); };
$("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };

function onMessage(m) {
  if (all.some((x) => x.id === m.id)) return;
  all.push(m);
  if (m.direction === "in" && String(m.chatId) !== String(current)) unread[m.chatId] = (unread[m.chatId] || 0) + 1;
  renderChats();
  if (String(m.chatId) === String(current)) renderLog();
}

(async () => {
  const r = await fetch("/api/messages");
  (await r.json()).forEach((m) => all.push(m));
  renderChats();
  const es = new EventSource("/events");
  es.onmessage = (e) => onMessage(JSON.parse(e.data));
})();
</script>
</body>
</html>
